; HogsFix.asi settings (1 = on, 0 = off). Keep this file next to HogsFix.asi.
[General]
; write HogsFix.log next to the .asi (for bug reports)
Log=0

[Fixes]
; skip the CD check (harmless where the check already passes)
NoCD=1
; run from the folder the exe is in (the game otherwise uses the install path from the registry and refuses
; to start without it)
Portable=1
; CPU pigs never move (inverted path-request bounds check)
AIFix=1
; game disabled every other window on the desktop while running (taskbar/apps unclickable after a crash)
WinFix=1
; menus froze for good after the game window was minimized (alt-tab out of fullscreen)
ResumeFix=1
; GOG's warhogs_.exe: allow Alt+Tab and the Windows key again (GOG's compatibility fix "IgnoreAltTab" blocks them)
AltTab=1
; flickering / missing terrain blocks on 32-bit desktops (NVIEW culling tables)
NviewFix=1
; title screen: "press any key" words were drawn with white boxes over the picture (white = transparent)
TitleText=1

[Widescreen]
; launcher offers widescreen resolutions up to 2048 pixels wide (DirectX 7 limit; a 4K screen gets 1920x1080 = exact 2x),
; battle uses Hor+ field of view
Enable=1
; widen the terrain culling tables by N blocks (0-4) so the wider view has no holes at the edges
NviewWiden=1

[Battle]
; battle loop: no busy spin (CPU 100% -> ~5%), rendering decoupled from the 25 Hz game tick
Enable=1
; render rate in battle (0 = original 25 FPS)
FrameHz=60
; interpolate camera and objects between game ticks (0 = repeat frames)
Interp=1

[Display]
; native DirectDraw fixes: surface loss after mode changes, Bink crash, alt-tab/minimize recovery, 32-bpp sprites,
; intro movies (no DirectX wrapper needed)
Fix=1
; run in a resizable window instead of fullscreen (sized to the launcher resolution, limited to the monitor's refresh rate)
Windowed=0
; Windows hides 16-bit display modes from old games unless the 'DWM8And16BitMitigation' compatibility layer is on
; (empty mode list in the launcher, crash after Start). Shim16Bit/DpiAware: if a layer is missing, the game restarts
; itself once with it (no registry change)
Shim16Bit=1
; HIGHDPIAWARE layer: otherwise Windows scales the game by the desktop scale factor (picture larger than the screen)
DpiAware=1
; draw menu sprites into a system-memory copy and copy it back once per frame (menus ran at ~10-15 FPS)
FastBlit=1
; menu frame rate: the menu animations (blinking lamps, smoke, buttons) advance once per frame and were made for
; 25 FPS (the PAL PlayStation rate); 0 = unlimited (animations run too fast)
MenuFPS=25

[Music]
; the game plays its music from audio CD tracks (MCI cdaudio) and sets the volume on the mixer's CD line - neither
; exists on a modern PC. Emulated here: plays MUSIC\TrackNN.ogg (decoder built in, no extra DLLs; GOG's winmm.dll proxy
; and the libogg/libvorbis DLLs are not needed)
Enable=1
; music volume in percent (on top of the in-game volume)
Volume=100

[Gamepad]
; Xbox controller (any XInput gamepad, hot-plug) with the PlayStation layout: A = cross, B = circle, X = square,
; Y = triangle, LB/RB = L1/R1, LT/RT = L2/R2, Start = pause; in battle it presses the keys set in Optionen -> Steuerung.
; XInput gamepads are hidden from the game's own DirectInput joystick support (different button order)
Enable=1
; left stick dead zone in percent of the stick range
Deadzone=30
